<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Favicon & PWA Icons -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- PWA Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SPMB Madina" />

    <title>SPMB Pondok Pesantren Al-Madina 2027/2028 - Prabumulih</title>
    <meta name="description" content="Sistem Penerimaan Murid Baru (SPMB) Pondok Pesantren Al-Madina Prabumulih Tahun Ajaran 2027/2028. Pendaftaran online terhubung Google Spreadsheet." />
    
    <!-- Open Graph & Social Cards -->
    <meta property="og:title" content="SPMB Pondok Pesantren Al-Madina 2027/2028" />
    <meta property="og:description" content="Penerimaan Santri Baru Pondok Pesantren Al-Madina Prabumulih. Cetak Kartu Ujian & Cek Status Terintegrasi." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">

    <!-- CSS Rule to suppress Netlify HUD / "Powered by Netlify" Badge -->
    <style>
      #nl-badge-frame,
      #nl-hud-frame,
      iframe[title*="Netlify"],
      iframe[title*="Powered by Netlify"],
      [data-netlify-site-id] {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        width: 0 !important;
        height: 0 !important;
        position: absolute !important;
        left: -9999px !important;
      }
    </style>
  </head>
  <body class="bg-slate-50 antialiased font-sans text-slate-800">
    <div id="root">
      <!-- Splash Screen Awal: Background Putih & Logo logp.png Proporsional di Tengah -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #ffffff; padding: 24px;">
        <img 
          src="/logp.png" 
          alt="Pondok Pesantren Al-Madina" 
          style="width: 250px; max-width: 65vw; height: auto; object-fit: contain;" 
        />
      </div>
    </div>
    
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Service Worker Registration
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js', { scope: '/' }).then(registration => {
            console.log('SW registered successfully:', registration);
          }).catch(registrationError => {
            console.warn('SW registration failed:', registrationError);
          });
        });
      }

      // Automatically remove Netlify injected "Powered by Netlify" badge if rendered
      const removeNetlifyBadge = () => {
        const badge = document.getElementById('nl-badge-frame') || 
                      document.getElementById('nl-hud-frame') || 
                      document.querySelector('iframe[title*="Netlify"]');
        if (badge) {
          badge.remove();
        }
      };
      removeNetlifyBadge();
      const badgeObserver = new MutationObserver(removeNetlifyBadge);
      badgeObserver.observe(document.documentElement, { childList: true, subtree: true });
    </script>
  </body>
</html>
